{% extends "base.html" %}

{% block content %}
<h1>Employee Lists</h1>
<table class="table table-borderless">
    <thead class="border-bottom font-weight-bold">
        <tr>
            <th>Full Name</th>
            <th>Mobile</th>
            <th>Position</th>
        </tr>
    </thead>
    <tbody>
        {% for employee in employee_list %}
        <tr>
            <td>{{ employee.fullname }}</td>
            <td>{{ employee.mobile }}</td>
            <td>{{ employee.position }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock content %}
